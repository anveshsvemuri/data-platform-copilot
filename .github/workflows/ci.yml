name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest -q
      - run: data-copilot --index /tmp/knowledge-index.json --build-index
      - run: data-copilot --index /tmp/knowledge-index.json --cache /tmp/responses.json "What is the model promotion threshold?"
        env:
          COPILOT_TRACE_PATH: /tmp/traces.jsonl
      - run: data-copilot --summarize-traces /tmp/traces.jsonl --report-output /tmp/observability.json --minimum-grounded-rate 1.0 --maximum-p95-latency-ms 5000 --fail-on-alert
      - run: data-copilot --index /tmp/knowledge-index.json --evaluate evals/groundedness.json --minimum-pass-rate 1.0
      - run: data-copilot --index /tmp/knowledge-index.json --evaluate evals/adversarial.json --minimum-pass-rate 1.0
