name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest -q
      - run: data-copilot --index /tmp/knowledge-index.json --build-index
      - run: data-copilot --index /tmp/knowledge-index.json --cache /tmp/responses.json "What is the model promotion threshold?"
      - run: data-copilot --index /tmp/knowledge-index.json --evaluate evals/groundedness.json
